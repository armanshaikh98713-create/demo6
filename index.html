<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Inline CSS Site</title>

  <!-- Inline animations -->
  <style>
    /* Header fade-in animation */
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Button hover grow effect */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body style="margin:0; font-family:Arial, sans-serif; background: #f0f4f8;">

  <!-- Header Section -->
  <header style="background:#0d47a1; padding:50px; text-align:center; color:white;
                 animation: fadeIn 1s ease-out;">
    <h1 style="margin:0; font-size:3rem;">Welcome to My JENKINS PIPELINE</h1>
    <p style="font-size:1.2rem;">Simple • Elegant • Animated</p>
  </header>

  <!-- Navigation Buttons -->
  <nav style="text-align:center; margin-top:30px;">
    <button style="padding:15px 30px; font-size:1rem; margin:10px;
                   border:none; cursor:pointer;
                   background:#2962ff; color:white;
                   animation: fadeIn 1.2s ease-out;
                   transition:background 0.3s;"
            onmouseover="this.style.background='#0039cb'"
            onmouseout="this.style.background='#2962ff'">
      Home
    </button>
    <button style="padding:15px 30px; font-size:1rem; margin:10px;
                   border:none; cursor:pointer;
                   background:#2962ff; color:white;
                   transition:background 0.3s;"
            onmouseover="this.style.background='#0039cb'"
            onmouseout="this.style.background='#2962ff'">
      About
    </button>
  </nav>

  <!-- Content Cards with animation on hover -->
  <section style="display:flex; justify-content:space-around; flex-wrap:wrap; margin:40px;">
    <div style="width:250px; padding:20px; background:white; border-radius:8px;
                box-shadow:0 4px 8px rgba(0,0,0,0.1); margin:15px;
                transition:transform 0.3s; cursor:pointer;"
         onmouseover="this.style.transform='scale(1.05)'"
         onmouseout="this.style.transform='scale(1)'">
         <h1>arman shaikh</h1>
      <h3 style="margin-top:0; color:#0d47a1;">Feature One</h3>
      <p>Create engaging user experiences with CSS animations.</p>
    </div>

    <div style="width:250px; padding:20px; background:white; border-radius:8px;
                box-shadow:0 4px 8px rgba(0,0,0,0.1); margin:15px;
                transition:transform 0.3s; cursor:pointer;"
         onmouseover="this.style.transform='scale(1.05)'"
         onmouseout="this.style.transform='scale(1)'">
      <h3 style="margin-top:0; color:#0d47a1;">Feature Two</h3>
      <p>Responsive design that looks good on any screen size.</p>
    </div>
  </section>

  <!-- Footer -->
  <footer style="background:#0d47a1; padding:20px; text-align:center; color:white;">
    © 2026 My Modern Inline Site
  </footer>

</body>
</html>
